<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --color-app-bg, so the browser chrome on a phone blends into
         the page instead of showing a white band above it. -->
    <meta name="theme-color" content="#f8f9fb" />
    <title>Invoicely</title>
    <meta
      name="description"
      content="Invoicing for a small Singapore business with more than one person touching money."
    />
    <!-- Link previews. og:image has to be an absolute URL, so it names the live
         demo's host (README); change it if the app moves. The card is
         web/og-card/og-card.html rendered at 1200x630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Invoicely" />
    <meta property="og:title" content="Invoicely" />
    <meta
      property="og:description"
      content="Invoicing for a small Singapore business with more than one person touching money."
    />
    <meta property="og:image" content="https://invoicely-loo1.onrender.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Invoicely. Invoicing for a small Singapore business with more than one person touching money." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
