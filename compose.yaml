# Local development only. The credentials below are deliberately throwaway and
# this file is never used to run anything real — deployments get their database
# from SPRING_DATASOURCE_* environment variables and a secret store.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: invoicely
      POSTGRES_USER: invoicely
      POSTGRES_PASSWORD: invoicely
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
