spring.application.name=invoicely

# Local development points at the Postgres in compose.yaml.
# Anything real (CI, deploys) overrides these with SPRING_DATASOURCE_* env vars.
spring.datasource.url=jdbc:postgresql://localhost:5432/invoicely
spring.datasource.username=invoicely
spring.datasource.password=invoicely

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keeps the persistence context out of the view layer, so every query is
# deliberate and lazy loading can't fire behind a controller's back.
spring.jpa.open-in-view=false
