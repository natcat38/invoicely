spring.application.name=invoicely

# Local development points at the Postgres in compose.yaml.
# Anything real (CI, deploys) overrides these with SPRING_DATASOURCE_* env vars.
spring.datasource.url=jdbc:postgresql://localhost:5432/invoicely
spring.datasource.username=invoicely
spring.datasource.password=invoicely

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keeps the persistence context out of the view layer, so every query is
# deliberate and lazy loading can't fire behind a controller's back.
spring.jpa.open-in-view=false

# When a screen needs the same association for many rows at once - the invoice
# list needs each row's client, line items and payments - Hibernate would
# otherwise issue one query per row. This batches them into groups of 50, which
# turns a page of 20 invoices from ~60 queries into a handful.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Signs the access tokens. Left unset here on purpose: SecurityConfig generates
# a random key at startup instead, so a developer needs no setup and no secret
# is ever committed to this repository. Every real environment must set it
# (INVOICELY_SECURITY_SECRET), or tokens stop working at each restart and two
# instances will not accept each other's.
# invoicely.security.secret=
invoicely.security.token-lifetime=12h

# Origins CORS allows to call this API from a browser. Left unset here too:
# SecurityProperties defaults it to Vite's dev server (http://localhost:5173),
# so local development needs no setup. Every real environment must set it
# explicitly (INVOICELY_SECURITY_ALLOWED_ORIGINS) to wherever the UI is
# actually served from — never '*', because an explicit allow-list is the
# whole point of CORS: it is what lets a legitimate browser client be told
# apart from any other page on the internet trying to call this API.
# invoicely.security.allowed-origins=http://localhost:5173

# Swagger UI at /swagger-ui.html; the raw document at /v3/api-docs.
springdoc.swagger-ui.path=/swagger-ui.html
# Sections alphabetically, and operations within a section by HTTP method, so
# the page has a stable order instead of whichever one component scanning
# happened to produce.
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
